# Alien World - nginx config, run as the `nginx` container from docker-compose.yml.
#
# Verified 2026-08-11: nothing on the CVM listens on 80/443, so this container owns them.
# It reaches the app over the compose network as `app:3010` - NOT 127.0.0.1, which inside
# this container means the container itself.
#
# First run has a bootstrap problem: the port-443 block below cannot start before a
# certificate exists. nginx/bootstrap/ holds an HTTP-only config for that one run,
# selected with NGINX_CONF_DIR - no file is edited or moved. See docs/deployment_guide.md.
#
# If a host nginx is ever introduced on this box, this file still works as a reference
# server block - change proxy_pass to http://127.0.0.1:3010 and use `certbot --nginx`.

# Catch-all: anything arriving with an unknown Host - scanners hitting the raw IP, stray
# domains pointed here - gets the connection closed with no response. Without this, nginx
# serves whichever server block happens to be first, leaking a site to unintended callers.
# ssl_reject_handshake lets this listen on 443 without owning any certificate.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name hobbies.seekschool.nz;

    # ACME challenge for Let's Encrypt renewals (webroot shared with the certbot container)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hobbies.seekschool.nz;

    ssl_certificate     /etc/letsencrypt/live/hobbies.seekschool.nz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hobbies.seekschool.nz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Without this, /alienworld (no slash) resolves relative URLs against the subdomain root.
    location = /alienworld {
        return 301 /alienworld/;
    }

    # The prefix is forwarded intact, because Express mounts the whole site under it
    # (BASE_PATH in docker-compose.yml).
    #
    # `app` is resolved per-request via Docker's embedded DNS rather than once at startup.
    # With a literal `proxy_pass http://app:3010;` nginx refuses to boot whenever the app
    # container is down - one bad .env used to take the web server down too. Using a
    # variable defers resolution, so nginx starts and returns 502 instead of dying.
    #
    # A variable in proxy_pass also disables nginx's automatic URI pass-through, hence the
    # explicit $request_uri (which includes the query string).
    location /alienworld/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $alienworld_app http://app:3010;
        proxy_pass $alienworld_app$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Future hobby projects: add sibling location blocks here, each on its own port.
}
