# Alien World - server block for the HOST nginx on the Tencent CVM.
#
# The CVM's host nginx already owns 80/443 for seekschool.nz, so it terminates TLS and
# reverse-proxies this app, which listens on 127.0.0.1:3010 (`docker compose up -d app`).
# This file is a reference to copy from - see docs/deployment_guide.md.
#
# If hobbies.seekschool.nz already has a server block, copy only the two `location`
# blocks below into it. If not, this whole file works as the block; certbot --nginx
# writes the ssl_* lines for you.
#
# Bare-host alternative (`docker compose --profile standalone up -d`, nginx in a
# container): change proxy_pass to http://app:3010 - the container reaches the app by
# service name, not on localhost.

server {
    listen 80;
    server_name hobbies.seekschool.nz;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hobbies.seekschool.nz;

    ssl_certificate     /etc/letsencrypt/live/hobbies.seekschool.nz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hobbies.seekschool.nz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Without this, /alienworld (no slash) resolves relative URLs against the subdomain root.
    location = /alienworld {
        return 301 /alienworld/;
    }

    # No trailing slash on proxy_pass: the /alienworld/ prefix is forwarded intact,
    # because Express mounts the whole site under it (BASE_PATH in docker-compose.yml).
    location /alienworld/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Future hobby projects: add sibling location blocks here, each on its own port.
}
