# First-run bootstrap ONLY. Not used in normal operation.
#
# nginx cannot start the port-443 block in conf.d/alienworld.conf before a certificate
# exists, so the first boot serves plain HTTP just long enough for certbot's ACME
# challenge to succeed. Selected for that one run with:
#
#   NGINX_CONF_DIR=./nginx/bootstrap docker compose up -d --build
#
# then plain `docker compose up -d` remounts conf.d/ with TLS.

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name hobbies.seekschool.nz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serves the site over plain HTTP during bootstrap; replaced by the redirect to
    # HTTPS as soon as the certificate exists.
    location = /alienworld {
        return 301 /alienworld/;
    }

    location /alienworld/ {
        proxy_pass http://app:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
