services:
  app:
    build: .
    image: alienworld-web:latest
    container_name: alienworld-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3010"
      # public sub-path; must match `base` in client/vite.config.js (no trailing slash)
      BASE_PATH: /alienworld
    # bound to localhost only; nginx (container or host) is the public entrance
    ports:
      - "127.0.0.1:3010:3010"
    volumes:
      - app-data:/app/server/data
    # Node has global fetch; the slim image ships neither curl nor wget. Derived from
    # PORT/BASE_PATH so it stays correct if either changes.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const u='http://127.0.0.1:'+(process.env.PORT||3010)+(process.env.BASE_PATH||'')+'/api/health';fetch(u).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Verified 2026-08-11: nothing else on the CVM listens on 80/443, so this container owns
  # them and terminates TLS. Starts with the default `docker compose up -d`.
  nginx:
    image: nginx:1.27-alpine
    container_name: alienworld-nginx
    restart: unless-stopped
    # service_healthy, not the bare list form: `depends_on: [app]` only waits for the
    # container to START, which is why a crash-looping app used to drag nginx down with it.
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Defaults to the real TLS config. First boot has no certificate yet, so nginx cannot
      # start that config - run it once with the HTTP-only bootstrap dir instead:
      #   NGINX_CONF_DIR=./nginx/bootstrap docker compose up -d --build
      # then issue the certificate and drop back to plain `docker compose up -d`.
      - ${NGINX_CONF_DIR:-./nginx/conf.d}:/etc/nginx/conf.d:ro
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

  # run on demand for certificate issue/renewal:
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d YOUR_DOMAIN
  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

volumes:
  app-data:
  certbot-webroot:
  certbot-certs:
